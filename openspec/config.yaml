# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Vanilla JavaScript (ES6+), HTML5, CSS3, PWA (Service Worker cache-first, Web App Manifest)
  Architecture: Client-side single-page app (SPA), local state in localStorage, zero external dependencies
  Testing: None detected; strict_tdd disabled
  Style: Mobile-first responsive glassmorphism dark theme (#0d0f12, accent #ff6b00)

strict_tdd: true

testing:
  runner: "node:test"
  command: "npm test"
  framework: "Node.js Native Test Runner"
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: false
    command: null
  quality:
    linter: null
    type_checker: null
    formatter: null

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
